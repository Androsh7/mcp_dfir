[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_forensics"
version = "0.1.0"
description = "MCP server for enabling LLM forensics"
requires-python = ">=3.13"
dependencies = [
    "attrs",
    "loguru",
    "mcp",
    "python_on_whales",
    "requests",
]

[project.optional-dependencies]
dev = [
    "mcp[cli]",
    "ruff",
    "uv",
]

[tool.ruff]
target-version = "py313"
line-length = 120
select = [
    "E", # Pycodestyle errors
    "F", # Pyflakes
    "I", # Isort
    "PL", # Pylint
    "UP", # Pyupgrade
]

[tool.pylint.format]
max-line-length = 120

[tool.setuptools]
packages = ["llm_forensics"]